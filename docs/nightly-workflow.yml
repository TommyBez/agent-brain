# Install in the PRIVATE export repository with nightly-agent.mjs and its npm lockfile.
name: Nightly brain maintenance
on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brain-nightly
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node nightly-agent.mjs
        env:
          BRAIN_JOB_KIND: consolidation
          BRAIN_URL: ${{ vars.BRAIN_URL }}
          BRAIN_AGENT_TOKEN: ${{ secrets.BRAIN_AGENT_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CONSOLIDATION_MODEL: deepseek/deepseek-v4.1-flash
          EMBEDDING_MODEL: openai/text-embedding-3-small
  export:
    needs: consolidate
    if: always() && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node nightly-agent.mjs
        env:
          BRAIN_JOB_KIND: export
          BRAIN_URL: ${{ vars.BRAIN_URL }}
          BRAIN_AGENT_TOKEN: ${{ secrets.BRAIN_AGENT_TOKEN }}
          BRAIN_EXPORT_COMMIT: 'true'
          BRAIN_EXPORT_DIRECTORY: export
          GITHUB_TOKEN: ${{ github.token }}
